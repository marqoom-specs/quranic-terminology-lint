name: checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cargo clippy --release --all-targets --locked -- -D warnings
      - run: cargo test --release --locked
      - run: cargo build --release --locked
      - name: Both checks on this repository and the examples
        run: |
          ./target/release/quranic-terminology
          ./target/release/quranic-terminology examples/names/passing
          if ./target/release/quranic-terminology examples/names/failing; then exit 1; fi
          ./target/release/quranic-data examples/data/passing
          if ./target/release/quranic-data examples/data/failing; then exit 1; fi
          ./target/release/quranic-data registry
  hooks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pipx install pre-commit
      - run: pre-commit validate-manifest
      - name: The hooks, installed into other projects by pre-commit
        run: tests/hooks.sh
